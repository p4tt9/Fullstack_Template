name: CI/CD

on:
  push:
    branches: ["[[ git_default_branch ]]"]
  pull_request:
    branches: ["[[ git_default_branch ]]"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: [[ backend_artifact_id ]]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: [[ backend_artifact_id ]]/pom.xml
      - name: Backend testen
        run: ./mvnw --batch-mode verify

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: [[ frontend_app_name ]]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: [[ frontend_app_name ]]/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Frontend bauen
        run: npm run build -- --configuration production
      - name: Frontend testen
        run: npm test -- --watch=false --browsers=ChromeHeadless

  images:
    if: github.event_name != 'pull_request'
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    outputs:
      image-prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        name: Image-Namen bestimmen
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Backend-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ./[[ backend_artifact_id ]]
          push: true
          tags: |
            ${{ steps.names.outputs.prefix }}-backend:${{ github.sha }}
            ${{ steps.names.outputs.prefix }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ./[[ frontend_app_name ]]
          push: true
          tags: |
            ${{ steps.names.outputs.prefix }}-frontend:${{ github.sha }}
            ${{ steps.names.outputs.prefix }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    if: github.ref == 'refs/heads/[[ git_default_branch ]]' && github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Produktionsdateien übertragen
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: "deploy/"
          target: ${{ secrets.VPS_APP_DIR }}
          strip_components: 1
      - name: Auf dem VPS deployen
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            chmod +x backup.sh
            if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi
            printf '%s\n' 'BACKEND_IMAGE=${{ needs.images.outputs.image-prefix }}-backend:${{ github.sha }}' 'FRONTEND_IMAGE=${{ needs.images.outputs.image-prefix }}-frontend:${{ github.sha }}' > .images.env
            docker compose --env-file .env.prod --env-file .images.env -f compose.prod.yml pull [[ backend_artifact_id ]] [[ frontend_app_name ]]
            docker compose --env-file .env.prod --env-file .images.env -f compose.prod.yml up -d --wait --wait-timeout 180
